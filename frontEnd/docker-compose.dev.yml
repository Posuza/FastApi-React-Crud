version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: guts_frontend_standalone
    restart: unless-stopped
    ports:
      - "5173:5173"
    env_file:
      - ../.env
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - frontend-dev-network

networks:
  frontend-dev-network:
    driver: bridge