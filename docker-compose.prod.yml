version: '3.8'

services:
  # Database service
  mysql:
    image: mysql:8.0
    container_name: guts_mysql_prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_prod_data:/var/lib/mysql
    networks:
      - guts-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Backend service (production)
  backend:
    build:
      context: ./backEnd
      dockerfile: Dockerfile
      target: production
    container_name: guts_backend_prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=mysql+mysqlconnector://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      - ENVIRONMENT=production
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - guts-network
    volumes:
      - backend_prod_data:/app/data

  # Frontend service (production)
  frontend:
    build:
      context: ./frontEnd
      dockerfile: Dockerfile
      target: production
    container_name: guts_frontend_prod
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - guts-network

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: guts_nginx_prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
    networks:
      - guts-network

volumes:
  mysql_prod_data:
  backend_prod_data:
  nginx_logs:

networks:
  guts-network:
    driver: bridge